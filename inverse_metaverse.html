<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inverse Metaverse Vector Pipeline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050508;
      color: #f0f4f8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      overflow: hidden;
      display: flex;
      height: 100vh;
    }
    #hud {
      width: 320px;
      background: rgba(12, 14, 22, 0.92);
      border-right: 1px solid #1f2937;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
    }
    h1 {
      font-size: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #38bdf8;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 10px;
    }
    .stage {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .stage.active {
      border-color: #38bdf8;
      background: #111b27;
    }
    .stage-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .status {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      background: #1f2937;
      color: #9ca3af;
    }
    .stage.active .status {
      background: #0284c7;
      color: #ffffff;
    }
    .code-line {
      font-size: 11px;
      color: #94a3b8;
    }
    .controls {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid #1f2937;
      padding-top: 12px;
      font-size: 12px;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: #cbd5e1;
    }
    input[type="range"] {
      accent-color: #38bdf8;
    }
    canvas {
      flex: 1;
      display: block;
    }
  </style>
</head>
<body>
  <div id="hud">
    <h1>Inverse Metaverse</h1>

    <div class="stage active" id="stage-1" onclick="toggleStage(1)">
      <div class="stage-header">
        <span>01 Input Pool</span>
        <span class="status" id="status-1">READY</span>
      </div>
      <div class="code-line">&amp;r == xora#FFFFFF</div>
    </div>

    <div class="stage active" id="stage-2" onclick="toggleStage(2)">
      <div class="stage-header">
        <span>02 Compute Layer</span>
        <span class="status" id="status-2">ACTIVE</span>
      </div>
      <div class="code-line">platonic_shapes(1, 1)</div>
    </div>

    <div class="stage active" id="stage-3" onclick="toggleStage(3)">
      <div class="stage-header">
        <span>03 Linking / Reasoning</span>
        <span class="status" id="status-3">ACTIVE</span>
      </div>
      <div class="code-line">rainbow_tables(PI)</div>
    </div>

    <div class="stage active" id="stage-4" onclick="toggleStage(4)">
      <div class="stage-header">
        <span>04 Execution Layer</span>
        <span class="status" id="status-4">ACTIVE</span>
      </div>
      <div class="code-line">pixels(r)</div>
    </div>

    <div class="controls">
      <label>
        Inverse Depth Warp: <span id="warp-val">1.0</span>
        <input type="range" id="warp" min="-2" max="2" step="0.1" value="1.0" />
      </label>
      <label>
        Vector Density: <span id="density-val">16</span>
        <input type="range" id="density" min="4" max="36" step="2" value="16" />
      </label>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const state = {
      1: true, // Input Pool (&r == xora#FFFFFF)
      2: true, // Compute Layer (platonic_shapes(1, 1))
      3: true, // Linking / Reasoning (rainbow_tables(PI))
      4: true  // Execution Layer (pixels(r))
    };

    function toggleStage(id) {
      state[id] = !state[id];
      const card = document.getElementById(`stage-${id}`);
      const badge = document.getElementById(`status-${id}`);
      card.classList.toggle("active", state[id]);
      badge.textContent = state[id] ? (id === 1 ? "READY" : "ACTIVE") : "IDLE";
    }

    function resize() {
      canvas.width = window.innerWidth - 320;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // Base Platonic icosahedron-inspired vertices
    const phi = (1 + Math.sqrt(5)) / 2;
    const baseVertices = [
      [-1,  phi, 0], [ 1,  phi, 0], [-1, -phi, 0], [ 1, -phi, 0],
      [ 0, -1,  phi], [ 0,  1,  phi], [ 0, -1, -phi], [ 0,  1, -phi],
      [ phi, 0, -1], [ phi, 0,  1], [-phi, 0, -1], [-phi, 0,  1]
    ];

    const edges = [
      [0,1],[0,5],[0,7],[0,10],[0,11],[1,5],[1,7],[1,8],[1,9],
      [2,3],[2,4],[2,6],[2,10],[2,11],[3,4],[3,6],[3,8],[3,9],
      [4,5],[4,9],[4,11],[5,9],[5,11],[6,7],[6,8],[6,10],[7,8],[7,10],
      [8,9],[10,11]
    ];

    // Stage 01: Bitwise XOR against 0xFFFFFF reference
    function xorFilter(val) {
      return state[1] ? ((val ^ 0xFFFFFF) & 0xFF) / 255 : 0.5;
    }

    // Stage 02: 3D rotation & Inverse Metaverse perspective projection
    function project(v, angle, scale, warp) {
      let [x, y, z] = v;

      // Rotate Y and X
      const cosY = Math.cos(angle), sinY = Math.sin(angle);
      const x1 = x * cosY - z * sinY;
      const z1 = z * cosY + x * sinY;

      const cosX = Math.cos(angle * 0.6), sinX = Math.sin(angle * 0.6);
      const y2 = y * cosX - z1 * sinX;
      const z2 = z1 * cosX + y * sinX;

      // Inverse perspective: objects further away expand outward
      const invZ = 1 / Math.max(0.25, 3.2 - z2 * warp);
      return {
        x: canvas.width / 2 + x1 * scale * invZ,
        y: canvas.height / 2 + y2 * scale * invZ,
        depth: z2
      };
    }

    let tick = 0;

    function render() {
      tick += 0.015;
      const warp = parseFloat(document.getElementById("warp").value);
      const density = parseInt(document.getElementById("density").value, 10);
      document.getElementById("warp-val").textContent = warp.toFixed(1);
      document.getElementById("density-val").textContent = density;

      // Stage 04: Execution Layer background clear / trail
      ctx.fillStyle = state[4] ? "rgba(5, 5, 8, 0.25)" : "#050508";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!state[4]) {
        requestAnimationFrame(render);
        return;
      }

      const seedOffset = xorFilter(Math.floor(tick * 60));

      // Render nested inverse vector shells
      for (let layer = 1; layer <= density; layer++) {
        const ratio = layer / density;
        const scale = 90 + ratio * 220;
        const angle = tick + ratio * Math.PI * (state[1] ? seedOffset + 0.5 : 0.2);

        const projected = baseVertices.map(v => project(v, angle, scale, warp));

        // Stage 03: Linking / Reasoning via PI-mapped spectral hue
        const hue = state[3]
          ? ((layer * Math.PI * 36) + tick * 60) % 360
          : 200;

        ctx.strokeStyle = `hsla(${hue}, 90%, 60%, ${0.15 + (1 - ratio) * 0.55})`;
        ctx.lineWidth = state[2] ? 1.4 : 0.6;

        if (state[2]) {
          // Draw Platonic vector wireframe
          ctx.beginPath();
          for (const [a, b] of edges) {
            ctx.moveTo(projected[a].x, projected[a].y);
            ctx.lineTo(projected[b].x, projected[b].y);
          }
          ctx.stroke();
        } else {
          // Fallback raw point cloud when Compute Layer is Idle
          for (const p of projected) {
            ctx.fillStyle = `hsla(${hue}, 90%, 65%, 0.8)`;
            ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
          }
        }
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
